{% extends "dashboard/base.html" %}

{% block title %}
<title>Удалить из списка наблюдения</title>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="mb-4">Удалить из списка наблюдения</h1>
        <div class="alert alert-warning">
            <p>Вы уверены, что хотите удалить <strong>{{ object.share.ticker }} — {{ object.share.name }}</strong> из списка наблюдения?</p>
        </div>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{% url 'dashboard:watchlist' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
